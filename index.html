<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIVAKOTIREDDY Apps</title>
<style>
  :root { --bg:#f6f4ff; --card:#ffffff; --text:#1d1b2e; --muted:#5d5a72; --brand:#6a3df0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121019; --card:#1e1b29; --text:#f2f0fa; --muted:#a9a5bd; --brand:#a98bff; } }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:640px; margin:0 auto; padding:48px 16px; }
  .card { background:var(--card); border-radius:20px; padding:28px; box-shadow:0 4px 24px rgba(0,0,0,.06); }
  h1 { margin:0 0 4px; font-size:28px; }
  p { color:var(--muted); line-height:1.6; }
  a.button { display:inline-block; margin-top:8px; padding:12px 20px; border-radius:999px; background:var(--brand); color:#fff; text-decoration:none; font-weight:600; }
  footer { margin-top:24px; font-size:14px; color:var(--muted); }
  footer a { color:var(--brand); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>LocationAlert</h1>
    <p>Never miss your stop. LocationAlert rings an alarm when you get close to your destination, even with the phone locked. Built for bus, train, metro and cab journeys in India.</p>
    <a class="button" href="https://play.google.com/store/apps/details?id=com.sivakotireddy.locationalert">Get it on Google Play</a>
  </div>
  <footer>
    Apps by SIVAKOTIREDDY ·
    <a href="https://gist.github.com/SIVAKOTIREDDY1997/c28aeb7198b684879e139b993c05ccc4">Privacy policy</a>
  </footer>
</main>
</body>
</html>
